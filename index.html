<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive ROI & Savings Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-dark: #4A00E0; /* A vibrant purple as a primary color */
            --primary-accent: #8E2DE2; /* A lighter purple for accents */
            --success-color: #33B830; /* Green from the palette */
            --text-color: #E4F1F9;
            --bg-color: #0A192F; /* Dark blue background */
            --surface-color: #172A45; /* A slightly lighter blue for cards */
            --border-color: #8892B0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--border-color);
        }

        .card {
            background: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a3f5a;
        }

        h2 {
            color: #fff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--bg-color);
            color: #fff;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #2a3f5a;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-accent);
            cursor: pointer;
            border-radius: 50%;
        }

        .chart-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        #comparisonChartContainer {
            height: 300px; /* Set a fixed height for the bar chart container */
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Interactive Savings Dashboard</h1>
            <div class="subtitle">Real-Time Visualization of Process Improvement ROI</div>
        </header>

        <!-- Inputs Panel -->
        <div class="card">
            <h2>Adjust Variables</h2>
            <div class="form-group">
                <label for="people">Team Size (People)</label>
                <input type="number" id="people" value="7" min="1" step="1">
            </div>

            <div class="form-group">
                <label for="salary">Average Annual Salary ($)</label>
                <input type="number" id="salary" value="130000" min="0" step="1000">
            </div>
            
            <div class="form-group">
                <label for="utilizationRange">Allocation on Report (%)</label>
                <div class="slider-group">
                    <input type="range" id="utilizationRange" min="10" max="100" value="80" step="5">
                    <span id="utilizationVal" style="font-weight: bold; width: 40px;">80%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="currentDays">Current Processing Time (Days)</label>
                <input type="number" id="currentDays" value="90" min="1" step="1">
            </div>

            <div class="form-group">
                <label for="targetDays">Target Processing Time (Days)</label>
                <input type="number" id="targetDays" value="45" min="0" step="1">
            </div>
        </div>

        <!-- Charts and Results Panel -->
        <div class="card">
            <h2>Projected Impact</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center;">
                <div>
                    <h3>Cost Breakdown</h3>
                    <div class="chart-container" style="height: 250px;">
                        <canvas id="costChart"></canvas>
                    </div>
                </div>
                <div>
                    <h3>Man-Hours Breakdown</h3>
                    <div class="chart-container" style="height: 250px;">
                        <canvas id="hoursChart"></canvas>
                    </div>
                </div>
            </div>
             <div id="comparisonChartContainer" style="margin-top: 30px;">
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const inputs = ['people', 'salary', 'currentDays', 'targetDays'];
        const utilSlider = document.getElementById('utilizationRange');

        const costCtx = document.getElementById('costChart').getContext('2d');
        const hoursCtx = document.getElementById('hoursChart').getContext('2d');
        const comparisonCtx = document.getElementById('comparisonChart').getContext('2d');
        
        let costChart, hoursChart, comparisonChart;

        function createCharts() {
            costChart = new Chart(costCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Cost Saved', 'Remaining Cost'],
                    datasets: [{
                        data: [1,1],
                        backgroundColor: [ '#33B830', '#8E2DE2' ],
                        borderColor: 'transparent',
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff' } } } }
            });

            hoursChart = new Chart(hoursCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Hours Saved', 'Remaining Hours'],
                    datasets: [{
                        data: [1,1],
                        backgroundColor: [ '#33B830', '#4A00E0' ],
                        borderColor: 'transparent'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff' } } } }
            });

            comparisonChart = new Chart(comparisonCtx, {
                type: 'bar',
                data: {
                    labels: ['Current State', 'Target State'],
                    datasets: [
                        {
                            label: 'Labor Cost ($)',
                            data: [0, 0],
                            backgroundColor: '#8E2DE2',
                            yAxisID: 'y'
                        },
                        {
                            label: 'Man-Hours',
                            data: [0, 0],
                            backgroundColor: '#4A00E0',
                             yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#fff' } },
                        y: { position: 'left', ticks: { color: '#fff' }, grid: { color: '#2a3f5a' } },
                        y1: { position: 'right', ticks: { color: '#fff' }, grid: { drawOnChartArea: false } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }
        
        function calculate() {
            const people = parseFloat(document.getElementById('people').value) || 0;
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const currentDays = parseFloat(document.getElementById('currentDays').value) || 0;
            const targetDays = parseFloat(document.getElementById('targetDays').value) || 0;
            const utilization = parseFloat(utilSlider.value) / 100;

            document.getElementById('utilizationVal').textContent = (utilSlider.value) + '%';
            
            const hourlyRate = salary / 2080;
            const hoursPerDay = 8 * utilization;
            
            const currentHours = currentDays * people * hoursPerDay;
            const targetHours = targetDays * people * hoursPerDay;
            const hoursSaved = Math.max(0, currentHours - targetHours);

            const currentCost = currentHours * hourlyRate;
            const targetCost = targetHours * hourlyRate;
            const costSaved = Math.max(0, currentCost - targetCost);
            
            // Update Doughnut Charts
            costChart.data.datasets[0].data = [costSaved, targetCost];
            costChart.update();
            
            hoursChart.data.datasets[0].data = [hoursSaved, targetHours];
            hoursChart.update();

            // Update Bar Chart
            comparisonChart.data.datasets[0].data = [currentCost, targetCost];
            comparisonChart.data.datasets[1].data = [currentHours, targetHours];
            comparisonChart.update();
        }

        // Listeners
        inputs.forEach(id => document.getElementById(id).addEventListener('input', calculate));
        utilSlider.addEventListener('input', calculate);

        // Initial Calculation Run
        createCharts();
        calculate();

    </script>
</body>
</html>
